# Nocchi · GitHub Actions-Only CI
#
# 本仓库不在本地构建或测试：所有编译、单元测试和打包都在这里完成。
# - nocchikit : 共享 Swift Package 的单元测试（swift test）
# - macos-app : XcodeGen 生成工程 → Release 构建（ad-hoc 签名）→ 上传 zip
# - ios-app   : XcodeGen 生成工程 → Release 构建（通用 iOS 设备、未签名）→ 上传 ipa
#
# 失败时 scripts/ci/annotate-failure.sh 会把日志尾部写成 Check Run 注解，
# 这样在公开仓库里不登录也能通过 REST API 读到错误。

name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ENV_HINTS: "1"

jobs:
  nocchikit:
    name: NocchiKit · swift test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          echo "::notice title=Toolchain::$(xcodebuild -version | tr '\n' ' ') · $(swift --version 2>&1 | head -n 1)"

      - name: swift test
        working-directory: Packages/NocchiKit
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/nocchikit-test.log"

      - name: Surface failure log
        if: failure()
        run: bash scripts/ci/annotate-failure.sh "$RUNNER_TEMP/nocchikit-test.log" "NocchiKit tests failed"

  macos-app:
    name: macOS app · build
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen, xcbeautify & librsvg
        run: brew install xcodegen xcbeautify librsvg

      - name: Render app icons from SVG
        run: bash scripts/ci/render-icons.sh

      - name: Generate Xcode project
        run: |
          set -o pipefail
          xcodegen generate --spec macOS/project.yml 2>&1 | tee "$RUNNER_TEMP/mac-xcodegen.log"

      - name: Build (Release, ad-hoc signed)
        run: |
          set -o pipefail
          xcodebuild \
            -project macOS/Nocchi.xcodeproj \
            -scheme Nocchi \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd-mac" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            build 2>&1 | tee "$RUNNER_TEMP/mac-build.log" | xcbeautify --renderer github-actions

      - name: Package
        run: |
          APP="$RUNNER_TEMP/dd-mac/Build/Products/Release/Nocchi.app"
          codesign --verify --deep --strict --verbose=2 "$APP" || true
          lipo -info "$APP/Contents/MacOS/Nocchi" || true
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/Nocchi-macOS-${GITHUB_SHA::7}.zip"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: Nocchi-macOS
          path: dist/*.zip
          retention-days: 14

      - name: Surface failure log
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/mac-build.log"
          [ -f "$LOG" ] || LOG="$RUNNER_TEMP/mac-xcodegen.log"
          bash scripts/ci/annotate-failure.sh "$LOG" "macOS build failed"

  # ios-app 任务会在 iOS 工程提交后加入。
