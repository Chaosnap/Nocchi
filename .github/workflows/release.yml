# Nocchi · 发行版（GitHub Actions 构建并发布）
#
# 触发：推送 v* 标签（例如 v0.1.0），或在 Actions 页面手动运行并填写版本号。
# 产物：ad-hoc 签名的 macOS App（zip）+ SHA-256 校验；iOS 工程就绪后会一并附上未签名 ipa。
# 说明：正式签名与公证需要在仓库 Secrets 中配置 Developer ID 证书，届时在这里加 notarytool 步骤。

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（例如 0.1.0，不带 v）"
        required: true

permissions:
  contents: write

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ENV_HINTS: "1"

jobs:
  release:
    name: Build & publish
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen, xcbeautify & librsvg
        run: brew install xcodegen xcbeautify librsvg

      - name: Test NocchiKit
        working-directory: Packages/NocchiKit
        run: swift test

      - name: Render app icons from SVG
        run: bash scripts/ci/render-icons.sh

      - name: Build macOS app (Release, ad-hoc signed)
        run: |
          set -o pipefail
          xcodegen generate --spec macOS/project.yml
          xcodebuild \
            -project macOS/Nocchi.xcodeproj \
            -scheme Nocchi \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd-mac" \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            build 2>&1 | tee "$RUNNER_TEMP/mac-build.log" | xcbeautify --renderer github-actions

      - name: Package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APP="$RUNNER_TEMP/dd-mac/Build/Products/Release/Nocchi.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/Nocchi-macOS-$VERSION.zip"
          if [ -f iOS/project.yml ]; then echo "iOS project present — the iOS build will be added to releases once it is wired up."; fi
          (cd dist && shasum -a 256 * > SHA256SUMS.txt)
          ls -la dist
          cat dist/SHA256SUMS.txt

      - name: Release notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # 取 CHANGELOG.md 中「## [VERSION]」这一节；没有就退回到「未发布」一节。
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes-body.md
          if [ ! -s notes-body.md ]; then
            awk '/^## \[未发布\]/ { on = 1; next } on && /^## \[/ { exit } on { print }' CHANGELOG.md > notes-body.md
          fi
          {
            echo "## 下载"
            echo
            echo "- **macOS**：\`Nocchi-macOS-$VERSION.zip\`（macOS 14+，Apple 芯片与 Intel 通用）"
            echo
            echo "首次打开（ad-hoc 签名、未公证）："
            echo
            echo '```bash'
            echo "xattr -dr com.apple.quarantine /Applications/Nocchi.app"
            echo '```'
            echo
            echo "或在「系统设置 → 隐私与安全性」中点「仍要打开」。"
            echo
            cat notes-body.md
          } > notes.md
          cat notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* \
              --title "Nocchi $TAG" \
              --notes-file notes.md \
              --target "${{ github.sha }}"
          fi
          echo "::notice title=Release::Published Nocchi $TAG"

      - name: Surface failure log
        if: failure()
        run: bash scripts/ci/annotate-failure.sh "$RUNNER_TEMP/mac-build.log" "Release build failed"
