name: Bug report
description: Something in Nocchi isn't right? Tell us how to reproduce it.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please don't file security problems here; report them privately as described in [SECURITY.md](https://github.com/Chaosnap/Nocchi/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Nocchi version
      description: Shown in Settings → 关于 (About). For a CI build, give the name of the zip you downloaded.
      placeholder: "1.0.0, or Nocchi-macOS-abc1234.zip"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System and Mac model
      placeholder: "macOS 15.1 · MacBook Pro 14-inch (with a notch)"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part
      options:
        - Notch / Dynamic Island
        - Screen shutter
        - Selfie
        - Photo booth
        - Printing from photos
        - Developing and prints on the desktop
        - Decorating desk (drawing, stickers, templates)
        - Album (corkboard / card box / film / calendar)
        - Film stocks and looks
        - Settings
        - Something else
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Move the pointer onto the notch
        2. Click 自拍 (Selfie)
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Screenshots or recordings help (only use pictures you took yourself).
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I searched the existing issues and this isn't a duplicate.
          required: true
