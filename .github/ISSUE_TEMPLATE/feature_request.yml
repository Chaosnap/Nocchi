name: Feature request
description: Want a new camera body, film stock or way to play?
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: "Be as specific as you can: where it appears, how it works, what it looks like."
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What problem does it solve, or which moment does it make more fun?
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: References
      description: Links or descriptions are welcome. Nocchi's art is original and retro, and never copies a real brand's look.
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I searched the existing issues and this isn't a duplicate.
          required: true
