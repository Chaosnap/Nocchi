      <circle cx="838" cy="232" r="2.4"/>
      <circle cx="166" cy="610" r="2"/>
      <circle cx="862" cy="560" r="2.6"/>
      <circle cx="760" cy="886" r="2.2"/>
    </g>
    <!-- The flash has just fired -->
    <circle cx="312" cy="500" r="230" fill="url(#flashGlow)"/>
    <!-- Floor shadow -->
    <ellipse cx="524" cy="852" rx="318" ry="34" fill="#000" fill-opacity="0.55" filter="url(#blur28)"/>
    <ellipse cx="516" cy="842" rx="270" ry="10" fill="#000" fill-opacity="0.45" filter="url(#blur5)"/>
  </g>
  <rect id="tileStroke" x="101" y="101" width="822" height="822" rx="183" fill="none" stroke="#a5583e" stroke-opacity="0.35" stroke-width="3"/>

  <!-- Fresh print rising from the top slot (breaks out of the tile) -->
  <rect x="372" y="402" width="280" height="26" rx="13" fill="#1d1612"/>
  <g transform="rotate(-4 512 430)">
    <rect x="378" y="90" width="282" height="356" rx="6" fill="#000" fill-opacity="0.35" filter="url(#blur12)"/>
    <rect x="368" y="78" width="288" height="360" rx="6" fill="url(#paper)"/>
    <g clip-path="url(#printWindow)">
      <rect x="386" y="96" width="252" height="232" fill="url(#sky)"/>
      <circle cx="560" cy="198" r="64" fill="url(#sun)"/>
      <circle cx="560" cy="198" r="22" fill="#fff6dc"/>
      <path d="M386 246 C430 222 480 228 526 244 C572 260 606 238 638 228 L638 328 L386 328 Z" fill="#b8573a" fill-opacity="0.9"/>
      <path d="M386 284 C444 264 506 274 560 288 C596 298 620 290 638 284 L638 328 L386 328 Z" fill="#6e3527"/>
      <rect x="386" y="96" width="252" height="232" fill="url(#haze)"/>
    </g>
    <rect x="386" y="96" width="252" height="232" fill="none" stroke="#000" stroke-opacity="0.12" stroke-width="2"/>
    <path d="M368 78 L656 78 L520 438 L368 438 Z" fill="#fff" fill-opacity="0.08"/>
  </g>

  <!-- Camera body -->
  <rect x="200" y="606" width="22" height="104" rx="9" fill="url(#dial)"/>
  <g stroke="#ffffff" stroke-opacity="0.18" stroke-width="2">
    <path d="M204 620 L218 620"/><path d="M204 634 L218 634"/><path d="M204 648 L218 648"/>
    <path d="M204 662 L218 662"/><path d="M204 676 L218 676"/><path d="M204 690 L218 690"/>
  </g>
  <rect x="214" y="418" width="596" height="420" rx="104" fill="url(#bodyUpper)"/>
  <g clip-path="url(#bodyClip)">
    <rect x="214" y="706" width="596" height="140" fill="url(#bodyLower)"/>
    <path d="M214 706 L810 706" stroke="#5a4433" stroke-opacity="0.28" stroke-width="3"/>
    <path d="M214 710 L810 710" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/>
    <rect x="214" y="418" width="596" height="420" fill="url(#bodyEdge)"/>
    <!-- soft top-left sheen and top bevel -->
    <path d="M214 418 L520 418 L360 838 L214 838 Z" fill="#fff" fill-opacity="0.16"/>
    <rect x="214" y="418" width="596" height="24" fill="#ffffff" fill-opacity="0.55"/>
    <rect x="214" y="442" width="596" height="3" fill="#5a4433" fill-opacity="0.08"/>
  </g>
  <rect x="214" y="418" width="596" height="420" rx="104" fill="none" stroke="#5a4433" stroke-opacity="0.18" stroke-width="2"/>

  <!-- Flash window (fresnel) -->
  <rect x="250" y="462" width="136" height="84" rx="18" fill="url(#chrome)"/>
  <rect x="258" y="470" width="120" height="68" rx="12" fill="url(#fresnel)"/>
  <g stroke="#b9b2a5" stroke-opacity="0.55" stroke-width="2">
    <path d="M270 474 L270 534"/><path d="M282 474 L282 534"/><path d="M294 474 L294 534"/>
    <path d="M306 474 L306 534"/><path d="M318 474 L318 534"/><path d="M330 474 L330 534"/>
    <path d="M342 474 L342 534"/><path d="M354 474 L354 534"/><path d="M366 474 L366 534"/>
  </g>
  <rect x="258" y="470" width="120" height="22" rx="10" fill="#ffffff" fill-opacity="0.65"/>

  <!-- Sensor and viewfinder -->
  <circle cx="602" cy="490" r="15" fill="url(#chrome)"/>
  <circle cx="602" cy="490" r="9" fill="#141414"/>
  <circle cx="599" cy="487" r="3" fill="#ffffff" fill-opacity="0.6"/>
  <rect x="652" y="458" width="118" height="88" rx="18" fill="url(#chrome)"/>
  <rect x="660" y="466" width="102" height="72" rx="12" fill="url(#smoke)"/>
  <path d="M672 470 L712 470 L684 534 L662 534 Z" fill="#ffffff" fill-opacity="0.16"/>

  <!-- Lens: ivory collar, chrome ring, grooved barrel, coated glass -->
  <circle cx="520" cy="660" r="176" fill="#3a2418" fill-opacity="0.35" filter="url(#blur12)"/>
  <circle cx="512" cy="650" r="176" fill="url(#collar)"/>
  <circle cx="512" cy="650" r="176" fill="none" stroke="#5a4433" stroke-opacity="0.16" stroke-width="2"/>
  <circle cx="512" cy="650" r="160" fill="url(#chrome)"/>
  <circle cx="512" cy="650" r="148" fill="url(#barrel)"/>
  <g fill="none" stroke="#ffffff" stroke-width="2">
    <circle cx="512" cy="650" r="139" stroke-opacity="0.07"/>
    <circle cx="512" cy="650" r="130" stroke-opacity="0.05"/>
    <circle cx="512" cy="650" r="121" stroke-opacity="0.07"/>
    <circle cx="512" cy="650" r="112" stroke-opacity="0.05"/>
    <circle cx="512" cy="650" r="103" stroke-opacity="0.07"/>
  </g>
  <circle cx="512" cy="650" r="92" fill="url(#glass)"/>
  <circle cx="512" cy="650" r="84" fill="none" stroke="#8a6fe0" stroke-opacity="0.28" stroke-width="5"/>
  <circle cx="512" cy="650" r="54" fill="#070910" fill-opacity="0.65"/>
  <ellipse cx="478" cy="612" rx="38" ry="18" transform="rotate(-38 478 612)" fill="#ffffff" fill-opacity="0.55" filter="url(#blur2)"/>
  <circle cx="548" cy="688" r="8" fill="#ffffff" fill-opacity="0.3"/>
  <path d="M432 596 A112 112 0 0 1 520 540" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>

  <!-- Shutter button -->
  <circle cx="300" cy="768" r="50" fill="#3a2418" fill-opacity="0.3" filter="url(#blur5)"/>
  <circle cx="296" cy="762" r="50" fill="url(#collar)"/>
  <circle cx="296" cy="762" r="38" fill="url(#shutter)"/>
  <ellipse cx="284" cy="748" rx="16" ry="9" transform="rotate(-30 284 748)" fill="#ffffff" fill-opacity="0.4"/>

  <!-- Little ventilation slits on the lower right -->
  <g fill="#5a4433" fill-opacity="0.22">
    <rect x="700" y="752" width="64" height="7" rx="3.5"/>
    <rect x="700" y="768" width="64" height="7" rx="3.5"/>
    <rect x="700" y="784" width="64" height="7" rx="3.5"/>
