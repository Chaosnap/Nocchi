<?xml version="1.0" encoding="UTF-8"?>
<!--
  Nocchi · 刘海冲印店 — application icon (macOS tile: 824 px rounded square on a 1024 canvas).
  Original artwork, hand-authored vector (no external images, fonts or traced material).
  A retro ivory instant camera in a warm darkroom: the flash has just fired, and a fresh print
  rises from the slot on top — breaking out of the tile — still pale where it has not developed yet.
  Light comes from the upper left; every highlight and shadow follows it.
  The iOS full-bleed version is derived from this file in CI by scripts/ci/render-icons.sh.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="room" cx="38%" cy="22%" r="95%">
      <stop offset="0" stop-color="#7a3b28"/>
      <stop offset="0.45" stop-color="#3e1c14"/>
      <stop offset="1" stop-color="#1b0c08"/>
    </radialGradient>
    <radialGradient id="flashGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6e4" stop-opacity="0.85"/>
      <stop offset="0.35" stop-color="#ffd9a8" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffb980" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grain" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#b8664a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#b8664a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#b8664a" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="bodyUpper" x1="0.1" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#fffcf5"/>
      <stop offset="0.55" stop-color="#f3ecdf"/>
      <stop offset="1" stop-color="#e6dcc9"/>
    </linearGradient>
    <linearGradient id="bodyLower" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#ebe2d0"/>
      <stop offset="1" stop-color="#cdbfa4"/>
    </linearGradient>
    <linearGradient id="bodyEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.75" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#3a2418" stop-opacity="0.22"/>
    </linearGradient>

    <linearGradient id="chrome" x1="0.15" y1="0.1" x2="0.85" y2="0.9">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#cfcfcd"/>
      <stop offset="0.55" stop-color="#8d8c89"/>
      <stop offset="0.78" stop-color="#d9d8d4"/>
      <stop offset="1" stop-color="#7c7a76"/>
    </linearGradient>
    <radialGradient id="collar" cx="40%" cy="30%" r="75%">
      <stop offset="0" stop-color="#fbf7ef"/>
      <stop offset="1" stop-color="#d6cab3"/>
    </radialGradient>
    <radialGradient id="barrel" cx="42%" cy="36%" r="70%">
      <stop offset="0" stop-color="#2e2d2c"/>
      <stop offset="0.6" stop-color="#121211"/>
      <stop offset="1" stop-color="#030303"/>
    </radialGradient>
    <radialGradient id="glass" cx="38%" cy="32%" r="72%">
      <stop offset="0" stop-color="#4b5a86"/>
      <stop offset="0.38" stop-color="#1b2238"/>
      <stop offset="1" stop-color="#05070d"/>
    </radialGradient>
    <linearGradient id="fresnel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6e0d4"/>
    </linearGradient>
    <linearGradient id="smoke" x1="0" y1="0" x2="0.6" y2="1">
