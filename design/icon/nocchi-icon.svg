    <filter id="blur28" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="blur12" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="blur5" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="blur2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>

    <clipPath id="tileClip"><rect id="tileClipRect" x="100" y="100" width="824" height="824" rx="184"/></clipPath>
    <clipPath id="bodyClip"><rect x="214" y="418" width="596" height="420" rx="104"/></clipPath>
    <clipPath id="printWindow"><rect x="386" y="96" width="252" height="232"/></clipPath>
  </defs>

  <!-- Tile shadow and darkroom tile -->
