    </radialGradient>
    <linearGradient id="dial" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#121110"/>
      <stop offset="0.5" stop-color="#3a3836"/>
      <stop offset="1" stop-color="#0d0c0b"/>
    </linearGradient>

    <linearGradient id="paper" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#efe7d6"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9d896"/>
      <stop offset="0.5" stop-color="#f0a062"/>
      <stop offset="1" stop-color="#c85f3c"/>
